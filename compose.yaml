services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: docdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      DOCDESK_DB_PASSWORD: ${DOCDESK_DB_PASSWORD:?Set DOCDESK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DOCDESK_DB_PORT:-5434}:5432"
    volumes:
      - docdesk_pg:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d docdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DOCDESK_DB_HOST: db
      DOCDESK_DB_PORT: "5432"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  docdesk_pg:
